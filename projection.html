<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <title>Proiecție Display</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; }
    body {
      overflow: hidden;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      background: #0b0d12;
      transition: background 0.4s ease;
    }
    /* ---- Fundaluri neutre ---- */
    body.bg-neutru-inchis { background: radial-gradient(ellipse at 50% 40%, #1c2230 0%, #0b0d12 75%); }
    body.bg-albastru       { background: radial-gradient(ellipse at 50% 40%, #14324d 0%, #071019 75%); }
    body.bg-gri            { background: linear-gradient(160deg, #23272e 0%, #101216 100%); }
    body.bg-imagine {
      background-image: linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0.65)), url('https://images.unsplash.com/photo-1519817650390-64a93db51149?q=80&w=1920&auto=format&fit=crop');
      background-size: cover; background-position: center;
    }
    body.bg-negru { background: #000; }

    .blackout { background: #000000 !important; }
    .blackout #rootContent { display: none !important; }

    #rootContent { flex: 1; display: flex; flex-direction: column; justify-content: space-between; min-height: 0; }

    .top-header { padding: 20px 36px; display: flex; justify-content: flex-end; }
    #clock {
      font-size: 24px; font-weight: 600; color: #e8ecf4;
      background: rgba(10, 12, 18, 0.55); padding: 5px 14px; border-radius: 8px;
      backdrop-filter: blur(8px);
    }

    .content-area {
      flex: 1; display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      padding: 10px 90px 30px 90px; text-align: center;
      min-height: 0; overflow: hidden;
      text-shadow: 0 4px 18px rgba(0,0,0,0.9);
    }
    #slideTitle { font-size: 44px; font-weight: 800; color: #f4c542; margin-bottom: 26px; letter-spacing: 0.4px; }
    #slideText {
      font-size: 52px; font-weight: 600; line-height: 1.4;
      white-space: pre-line; max-width: 92%;
    }
    #slideText.aleft  { text-align: left;   align-self: flex-start; }
    #slideText.acenter{ text-align: center; align-self: center; }
    #slideText.aright { text-align: right;  align-self: flex-end; }

    /* titluri interne / anunțuri structurate */
    #slideText .ch-header { display: block; font-size: 0.62em; font-weight: 800; color: #f4c542; margin: 0.4em 0 0.55em; letter-spacing: 0.3px; }
    #slideText .line { display: block; margin: 0.18em 0; }
    #slideText .sub { display: block; margin: 0.12em 0 0.12em 1.6em; font-size: 0.86em; color: #d7deea; }
    #slideText .bullet { display: flex; gap: 0.55em; align-items: flex-start; text-align: left; margin: 0.28em 0; }
    #slideText .bullet::before { content: "•"; color: #f4c542; font-weight: 900; }
    #slideText .bullet.sub { margin-left: 1.8em; }
    #slideText .bullet.sub::before { content: "–"; color: #9fb4d6; }

    /* moduri speciale: bine ati venit / anunț liniște */
    #slideText.mode-welcome { font-size: 64px; font-weight: 800; }
    #slideText.mode-notice  { font-size: 52px; font-weight: 700; }
    #slideText.mode-welcome .line, #slideText.mode-notice .line { margin: 0.3em 0; }

    #footerMessage {
      padding: 10px 40px 26px 40px; text-align: center;
      font-size: 26px; font-weight: 500; color: #dfe6f2;
      text-shadow: 0 2px 10px rgba(0,0,0,0.9);
    }
    #footerMessage .verse-ref { display: block; margin-top: 6px; font-size: 0.78em; color: #f4c542; font-weight: 700; }

    #mediaPlayer { position: fixed; inset: 0; display: none; background: #000; z-index: 20; align-items: center; justify-content: center; }
    #mediaPlayer.visible { display: flex; }
    #mediaPlayer iframe, #mediaPlayer img, #mediaPlayer video { width: 100%; height: 100%; border: none; object-fit: contain; }
  </style>
</head>
<body id="displayRoot" class="bg-neutru-inchis">

  <div id="rootContent">
    <div class="top-header"><div id="clock">00:00:00</div></div>

    <div class="content-area">
      <div id="slideTitle"></div>
      <div id="slideText" class="acenter"></div>
    </div>

    <div id="footerMessage"></div>
  </div>

  <div id="mediaPlayer"></div>

  <script>
    const { ipcRenderer } = require('electron');

    setInterval(() => {
      const now = new Date();
      document.getElementById('clock').innerText = now.toLocaleTimeString('ro-RO');
    }, 1000);

    // Construieste textul slide-ului ca elemente DOM sigure (fara HTML injectat)
    function buildRichText(container, rawText) {
      container.innerHTML = '';
      const lines = String(rawText || '').split('\n');
      for (let raw of lines) {
        const line = raw.replace(/\s+$/,'');
        if (!line.trim()) continue;
        if (/^###\s+/.test(line)) {
          const h = document.createElement('span');
          h.className = 'ch-header';
          h.innerText = line.replace(/^###\s+/, '').trim();
          container.appendChild(h);
        } else if (/^\s{2,}-/.test(line) || /^\s{2,}•/.test(line)) {
          const b = document.createElement('span');
          b.className = 'bullet sub';
          b.innerText = line.replace(/^\s+[-•]\s*/, '').trim();
          container.appendChild(b);
        } else if (/^[-•]\s+/.test(line)) {
          const b = document.createElement('span');
          b.className = 'bullet';
          b.innerText = line.replace(/^[-•]\s*/, '').trim();
          container.appendChild(b);
        } else {
          const s = document.createElement('span');
          s.className = 'line';
          s.innerText = line;
          container.appendChild(s);
        }
      }
    }

    ipcRenderer.on('render-slide', (event, data) => {
      const root = document.getElementById('displayRoot');
      const content = document.getElementById('rootContent');
      const mediaBox = document.getElementById('mediaPlayer');
      const titleEl = document.getElementById('slideTitle');
      const textEl = document.getElementById('slideText');
      const footerEl = document.getElementById('footerMessage');

      if (!data) return;

      // Blackout / ecran negru
      if (data.kind === 'black' || data.blackout) {
        root.classList.add('blackout');
        mediaBox.classList.remove('visible');
        mediaBox.innerHTML = '';
        return;
      }
      root.classList.remove('blackout');

      // Schimbare fundal
      if (data.kind === 'bg') {
        const cls = data.bgClass || 'bg-neutru-inchis';
        root.className = cls + (root.classList.contains('blackout') ? ' blackout' : '');
        return;
      }

      // Redare media YouTube
      if (data.kind === 'yt' && data.videoId) {
        mediaBox.innerHTML = '<iframe src="https://www.youtube-nocookie.com/embed/' + encodeURIComponent(data.videoId) + '?autoplay=1&controls=0&rel=0&modestbranding=1" allow="autoplay; encrypted-media"></iframe>';
        mediaBox.classList.add('visible');
        return;
      }

      // Imagine / harta biblice
      if (data.kind === 'image' && data.image) {
        mediaBox.innerHTML = '<img src="' + data.image + '" alt="">';
        mediaBox.classList.add('visible');
        return;
      }

      // Opreste media
      if (data.kind === 'clear' || data.mediaType === 'none') {
        mediaBox.classList.remove('visible');
        mediaBox.innerHTML = '';
      }

      // Slide text normal
      titleEl.innerText = data.title || '';
      if (data.titleColor) titleEl.style.color = data.titleColor;
      else titleEl.style.color = '#f4c542';
      titleEl.style.display = (data.title || '').trim() ? 'block' : 'none';

      const mode = data.mode || 'plain';
      textEl.className = 'acenter mode-' + mode;
      buildRichText(textEl, data.text || '');
      textEl.style.color = data.textColor || '#ffffff';
      if (data.align === 'left') textEl.classList.add('aleft');
      else if (data.align === 'right') textEl.classList.add('aright');

      // subsol: verset / mesaj mic
      if (data.footer) {
        footerEl.innerHTML = '';
        const ft = document.createElement('span');
        ft.innerText = data.footer;
        footerEl.appendChild(ft);
        if (data.footerRef) {
          const ref = document.createElement('span');
          ref.className = 'verse-ref';
          ref.innerText = data.footerRef;
          footerEl.appendChild(ref);
        }
        footerEl.style.display = 'block';
      } else {
        footerEl.innerHTML = '';
        footerEl.style.display = 'none';
      }

      if (data.bgClass && !root.classList.contains('blackout')) {
        root.className = data.bgClass;
      }
    });
  </script>
</body>
</html>
