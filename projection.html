<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <title>Proiecție Display</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; }
    body {
      overflow: hidden; color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex; flex-direction: column; background: #0b0d12;
    }
    /* Un singur fundal, pe tot ecranul (cantare/biblie/start) */
    body.bg-neutru-inchis { background: radial-gradient(ellipse at 50% 40%, #1c2230 0%, #0b0d12 75%); }
    body.bg-albastru       { background: radial-gradient(ellipse at 50% 40%, #14324d 0%, #071019 75%); }
    body.bg-gri            { background: linear-gradient(160deg, #23272e 0%, #101216 100%); }
    body.bg-negru          { background: #000; }
    body.bg-imagine {
      background-image: linear-gradient(rgba(0,0,0,0.45),rgba(0,0,0,0.55)),url('https://images.unsplash.com/photo-1519817650390-64a93db51149?q=80&w=1920&auto=format&fit=crop');
      background-size: cover; background-position: center;
    }
    body.bg-custom { background: #000 no-repeat center center; }
    .blackout { background:#000 !important; }
    .blackout #rootContent, .blackout #mediaPlayer { display:none !important; }

    /* Voal intunecat pe TOT ecranul cand se proiecteaza ceva (cantare/biblie/anunt) */
    #veil {
      position: fixed; inset: 0; z-index: 1; pointer-events: none;
      background: linear-gradient(180deg, rgba(6,8,13,0.82), rgba(6,8,13,0.72));
      opacity: 0; transition: opacity 0.35s ease;
    }
    #veil.on { opacity: 1; }

    #rootContent { flex:1; display:flex; flex-direction:column; justify-content:space-between; min-height:0; position:relative; z-index:2; }

    /* Ceas: fara chip, "in interiorul" fundalului, armonizat */
    .top-header { padding: 22px 34px 0 34px; display:flex; justify-content:flex-end; }
    #clock {
      font-size: 84px; font-weight: 800; color:#ffffff; line-height:1;
      text-shadow: 0 4px 26px rgba(0,0,0,0.85); font-variant-numeric: tabular-nums;
    }

    .content-area { flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center;
      padding: 6px 4vw 8px 4vw; text-align:center; min-height:0; overflow:hidden; width:100%; }
    .content-area.welcome-left { justify-content:center; align-items:flex-start; text-align:left; padding: 12vh 6vw 4vh 8vw; }
    .content-area.home-duo { justify-content:flex-start; align-items:stretch; text-align:left; padding: 36vh 5vw 4vh; }
    .duo-tray { display:flex; width:100%; justify-content:space-between; align-items:flex-start; gap:5vw; }
    .duo-tray.hidden { display:none; }
    .duo-l { max-width:48%; font-size:46px; font-weight:800; line-height:1.2; color:#f4c542; text-shadow:0 6px 30px rgba(0,0,0,1),0 2px 8px rgba(0,0,0,.95); }
    .duo-l .sub { display:block; margin-top:0.3em; font-size:.7em; font-weight:600; color:#ffffff; }
    .duo-r { max-width:46%; font-size:36px; font-weight:700; line-height:1.26; color:#ffffff; text-shadow:0 5px 26px rgba(0,0,0,1),0 2px 8px rgba(0,0,0,.95); }
    .duo-r .ref { display:block; margin-top:.45em; font-size:.6em; color:#f4c542; font-weight:800; }

    /* Ecran Bun-Venit curat: fara casete, text direct pe imagine */
    .content-area.welcome-clean { padding:0; position:relative; }
    #welcomeContainer {
      position:absolute; top:15%; left:0; width:100%; padding:0 5%;
      display:flex; justify-content:space-between; align-items:flex-start;
      background:transparent !important; border:none !important; box-shadow:none !important;
      pointer-events:none;
    }
    #welcomeContainer .wl, #welcomeContainer .wr {
      width:42%; background:none !important; border:none !important; box-shadow:none !important;
      text-align:center;
    }
    .ws { text-shadow: 2px 2px 6px rgba(0,0,0,0.95), 0 0 12px rgba(0,0,0,0.9); }
    .w-title { color:#ffd166; font-size:62px; font-weight:800; display:block; margin-bottom:6px; }
    .w-sub   { color:#ffffff; font-size:44px; font-weight:600; display:block; }
    .w-ref   { color:#ffd166; font-size:32px; font-weight:800; display:block; margin-top:10px; }
    .w-quote { color:#ffffff; font-size:46px; font-weight:700; line-height:1.3; display:block; }

    #slideText {
      max-width: 96%; font-weight: 700; line-height: 1.32;
      white-space: pre-line;
      text-shadow: 0 5px 30px rgba(0,0,0,0.95), 0 2px 8px rgba(0,0,0,0.9);
    }
    #slideText .ch-header { display:block; font-weight:900; color:#f4c542; }
    #slideText .line { display:block; margin:.06em 0; }
    #slideText .sub { display:block; margin:.04em 0 .04em 1.4em; font-size:.82em; opacity:.9; }
    #slideText .bullet { display:flex; gap:.45em; align-items:flex-start; text-align:left; }
    #slideText .bullet::before { content:"•"; font-weight:900; }
    #slideText .bullet.sub { margin-left:1.6em; }
    #slideText .bullet.sub::before { content:"–"; }

    #slideRef {
      display:none; color:#f4c542; font-weight:800; letter-spacing:.4px;
      text-shadow: 0 4px 22px rgba(0,0,0,1), 0 2px 8px rgba(0,0,0,.9);
      margin-bottom: 10px;
    }
    #footerMessage { padding: 4px 40px 26px; text-align:center; font-size:22px; opacity:.92;
      text-shadow: 0 2px 12px rgba(0,0,0,0.95); }
    #footerMessage .verse-ref { display:block; margin-top:2px; font-size:.85em; font-weight:700; color:#f4c542; }

    #mediaPlayer { position:fixed; inset:0; display:none; background:#000; z-index:30; }
    #mediaPlayer.visible { display:block; }
    #mediaPlayer #ytHolder, #mediaPlayer img, #mediaPlayer video { width:100%; height:100%; border:none; object-fit:contain; }
  </style>
</head>
<body id="displayRoot" class="bg-neutru-inchis">

  <div id="veil"></div>

  <div id="rootContent">
    <div class="top-header"><div id="clock">--:--</div></div>
    <div class="content-area" id="contentArea">
      <div id="slideRef"></div>
      <div id="slideText"></div>
    </div>
    <div id="footerMessage"></div>
  </div>

  <div id="mediaPlayer"><div id="ytHolder"></div></div>

  <script>
    const { ipcRenderer } = require('electron');

    let fontScale = 1;
    let curBg = 'bg-neutru-inchis';
    let ytPlayer = null;
    let localVid = null;
    let ytLastVol = 50;
    let mode = 'plain';
    let lastTextData = null;

    setInterval(() => {
      const n = new Date();
      const hh = String(n.getHours()).padStart(2, '0');
      const mm = String(n.getMinutes()).padStart(2, '0');
      document.getElementById('clock').innerText = hh + ':' + mm;
    }, 1000);

    function baseFontSize(m) { return m === 'welcome' ? 88 : (m === 'notice' ? 66 : 56); }

    function setBackground(cls) {
      curBg = cls || 'bg-neutru-inchis';
      const root = document.getElementById('displayRoot');
      root.className = curBg;
      root.style.backgroundImage = '';
    }
    function setBackgroundImage(dataUrl) {
      curBg = 'custom';
      const root = document.getElementById('displayRoot');
      root.className = '';
      root.style.backgroundImage = 'linear-gradient(180deg, rgba(8,10,16,0.28), rgba(8,10,16,0.60)), url("' + dataUrl + '")';
      root.style.backgroundSize = 'contain';
      root.style.backgroundRepeat = 'no-repeat';
      root.style.backgroundPosition = 'center center';
    }

    // ---------- fundal YouTube / video local ----------
    function hideMedia() {
      const media = document.getElementById('mediaPlayer');
      media.classList.remove('visible');
      if (ytPlayer) { try { ytPlayer.stopVideo(); } catch(e){} ytPlayer = null; }
      if (localVid) { try { localVid.pause(); } catch(e){} localVid = null; }
      media.innerHTML = '<div id="ytHolder"></div>';
    }
    function hideMediaIfNeeded() {
      const media = document.getElementById('mediaPlayer');
      if (media && media.classList.contains('visible')) hideMedia();
    }
    function stopAny() {
      if (ytPlayer) { try { ytPlayer.stopVideo(); } catch(e){} ytPlayer = null; }
      if (localVid) { try { localVid.pause(); } catch(e){} localVid = null; }
    }
    function playLocal(src) {
      stopAny();
      const media = document.getElementById('mediaPlayer');
      media.innerHTML = '<video id="localVid" src="' + src + '" autoplay controls style="width:100%;height:100%;object-fit:contain;background:#000;"></video>';
      media.classList.add('visible');
      localVid = document.getElementById('localVid');
      localVid.onerror = () => { media.classList.remove('visible'); media.innerHTML = '<div id="ytHolder"></div>'; localVid = null; };
    }
    function ensureYtApi() {
      return new Promise((resolve) => {
        if (window.YT && YT.Player) { resolve(); return; }
        if (document.getElementById('ytapi')) { waitReady(); return; }
        const tag = document.createElement('script');
        tag.id = 'ytapi';
        tag.src = 'https://www.youtube.com/iframe_api';
        document.head.appendChild(tag);
        function waitReady() {
          const iv = setInterval(() => { if (window.YT && YT.Player) { clearInterval(iv); resolve(); } }, 200);
          setTimeout(() => clearInterval(iv), 20000);
        }
        waitReady();
      });
    }
    let ytFallbackDone = false;
    function tryYtFallback(id) {
      if (ytFallbackDone) return;
      ytFallbackDone = true;
      if (ytPlayer) { try { ytPlayer.stopVideo(); } catch(e){} ytPlayer = null; }
      const media = document.getElementById('mediaPlayer');
      media.innerHTML = '<iframe src="https://www.youtube.com/embed/' + encodeURIComponent(id) + '?autoplay=1&rel=0&controls=1&modestbranding=1" allow="autoplay; encrypted-media" style="width:100%;height:100%;border:0"></iframe>';
      media.classList.add('visible');
    }
    async function playYoutube(id) {
      ytFallbackDone = false;
      stopAny();
      await ensureYtApi();
      const media = document.getElementById('mediaPlayer');
      media.innerHTML = '<div id="ytHolder"></div>';
      media.classList.add('visible');
      const holder = document.getElementById('ytHolder');
      ytPlayer = new YT.Player('ytHolder', {
        videoId: id,
        playerVars: { autoplay: 1, rel: 0, controls: 1, modestbranding: 1, playsinline: 1 },
        events: { onError: () => tryYtFallback(id) }
      });
    }
    function ytCommand(cmd) {
      if (localVid && localVid.duration !== undefined) {
        try {
          if (cmd === 'toggle') { if (localVid.paused) localVid.play(); else localVid.pause(); }
          else if (cmd === 'stop') hideMedia();
          else if (cmd === 'mute') localVid.muted = !localVid.muted;
          else if (cmd === 'vol-up') { localVid.muted = false; localVid.volume = Math.min(1, (localVid.volume || 0.8) + 0.1); }
          else if (cmd === 'vol-down') { localVid.muted = false; localVid.volume = Math.max(0, (localVid.volume || 0.8) - 0.1); }
        } catch (e) {}
        return;
      }
      if (!ytPlayer || !ytPlayer.getPlayerState) return;
      try {
        if (cmd === 'toggle') { if (ytPlayer.getPlayerState() === 1) ytPlayer.pauseVideo(); else ytPlayer.playVideo(); }
        else if (cmd === 'stop') hideMedia();
        else if (cmd === 'mute') {
          if (ytPlayer.isMuted()) { ytPlayer.unMute(); if (ytLastVol > 0) ytPlayer.setVolume(ytLastVol); }
          else { ytLastVol = ytPlayer.getVolume() || 50; ytPlayer.mute(); }
        }
        else if (cmd === 'vol-up') { ytLastVol = Math.min(100, (ytPlayer.getVolume() || 50) + 10); ytPlayer.setVolume(ytLastVol); }
        else if (cmd === 'vol-down') { ytLastVol = Math.max(0, (ytPlayer.getVolume() || 50) - 10); ytPlayer.setVolume(ytLastVol); }
      } catch (e) {}
    }

    // ---------- text ----------
    function buildRichText(container, rawText) {
      container.innerHTML = '';
      const lines = String(rawText || '').split('\n');
      for (const raw of lines) {
        const line = raw.replace(/\s+$/, '');
        if (!line.trim()) continue;
        if (/^###\s+/.test(line)) {
          const h = document.createElement('span'); h.className = 'ch-header';
          h.innerText = line.replace(/^###\s+/, '').trim(); container.appendChild(h);
        } else if (/^\s{2,}-/.test(line) || /^\s{2,}•/.test(line)) {
          const b = document.createElement('span'); b.className = 'bullet sub';
          b.innerText = line.replace(/^\s+[-•]\s*/, '').trim(); container.appendChild(b);
        } else if (/^[-•]\s+/.test(line)) {
          const b = document.createElement('span'); b.className = 'bullet';
          b.innerText = line.replace(/^[-•]\s*/, '').trim(); container.appendChild(b);
        } else {
          const s = document.createElement('span'); s.className = 'line'; s.innerText = line;
          container.appendChild(s);
        }
      }
    }

    // Auto-dimensionare: textul umple ecranul de proiectie, fara sa iasa
    function fitText() {
      const area = document.getElementById('contentArea');
      const el = document.getElementById('slideText');
      if (!area || !el) return;
      const refEl = document.getElementById('slideRef');
      const refShown = refEl && refEl.style.display !== 'none';
      const availH = Math.max(80, area.clientHeight - 24 - (refShown ? 90 : 0));
      const startF = Math.max(14, Math.round(baseFontSize(mode) * fontScale * 0.45));
      const maxF = Math.round(baseFontSize(mode) * fontScale * 2.1);
      el.style.fontSize = startF + 'px';
      let cur = startF;
      // creste treptat cat timp incape
      while (cur < maxF && el.scrollHeight <= availH) {
        cur += 6;
        el.style.fontSize = cur + 'px';
      }
      // daca a depasit, scadem pana incape
      while (el.scrollHeight > availH && cur > 16) {
        cur -= 2;
        el.style.fontSize = cur + 'px';
      }
    }

    function getDuoTray() {
      let tray = document.getElementById('duoTray');
      if (!tray) {
        tray = document.createElement('div');
        tray.id = 'duoTray';
        tray.className = 'duo-tray hidden';
        const area = document.getElementById('contentArea');
        area.insertBefore(tray, area.firstChild);
      }
      return tray;
    }
    function textToSpans(container, raw, cls) {
      container.className = cls;
      container.innerHTML = '';
      const lines = String(raw || '').split('\n');
      for (let i = 0; i < lines.length; i++) {
        if (!lines[i].trim()) { container.appendChild(document.createElement('br')); continue; }
        const s = document.createElement('span');
        s.style.display = 'block';
        s.innerText = lines[i];
        container.appendChild(s);
      }
    }
    function renderHomeDuo(data) {
      lastTextData = data;
      mode = 'home-duo';
      const area = document.getElementById('contentArea');
      const textEl = document.getElementById('slideText');
      const footerEl = document.getElementById('footerMessage');
      const veil = document.getElementById('veil');
      if (veil) veil.classList.remove('on');
      area.className = 'content-area home-duo';
      textEl.style.display = 'none';
      footerEl.innerHTML = '';
      const tray = getDuoTray();
      tray.classList.remove('hidden');
      let left = tray.querySelector('.duo-l');
      let right = tray.querySelector('.duo-r');
      if (!left) { left = document.createElement('div'); left.className = 'duo-l'; tray.appendChild(left); }
      if (!right) { right = document.createElement('div'); right.className = 'duo-r'; tray.appendChild(right); }
      // left: numele bisericii + bine ati venit (rândul 2 mai mic)
      const lLines = String(data.homeLeft || 'Betania Copșa Mică\nBine ați venit în Casa Domnului!').split('\n');
      left.innerHTML = '';
      for (let i = 0; i < lLines.length; i++) {
        const s = document.createElement('span');
        s.style.display = 'block';
        if (i === 1) { s.style.fontSize = '.72em'; s.style.fontWeight = '600'; s.style.color = '#ffffff'; }
        s.innerText = lLines[i];
        left.appendChild(s);
      }
      right.innerHTML = '';
      const rLines = String(data.homeRight || '„Noi propovăduim pe Hristos cel răstignit."').split('\n');
      for (let i = 0; i < rLines.length; i++) {
        const s = document.createElement('span'); s.style.display = 'block'; s.innerText = rLines[i];
        right.appendChild(s);
      }
      if (data.homeRef) {
        const ref = document.createElement('span');
        ref.className = 'ref';
        ref.innerText = data.homeRef;
        right.appendChild(ref);
      }
      if (data.bgClass) setBackground(data.bgClass);
    }

    function renderWelcome(data) {
      lastTextData = data;
      mode = 'welcome-duo';
      const area = document.getElementById('contentArea');
      const textEl = document.getElementById('slideText');
      const footerEl = document.getElementById('footerMessage');
      const veil = document.getElementById('veil');
      if (veil) veil.classList.remove('on');
      const tray = getDuoTray();
      if (tray) tray.classList.add('hidden');
      area.className = 'content-area welcome-clean';
      textEl.style.display = 'none';
      footerEl.innerHTML = '';
      let cont = document.getElementById('welcomeContainer');
      if (!cont) {
        cont = document.createElement('div');
        cont.id = 'welcomeContainer';
        area.appendChild(cont);
      }
      cont.style.display = 'flex';
      cont.innerHTML = '';
      const wl = document.createElement('div'); wl.className = 'wl';
      const wr = document.createElement('div'); wr.className = 'wr';
      const mk = (cls, txt) => { const s = document.createElement('span'); s.className = 'ws ' + cls; s.innerText = txt; return s; };
      wl.appendChild(mk('w-title', data.wTitle || 'Bine ați venit'));
      wl.appendChild(mk('w-sub', data.wSub || 'în Casa Domnului!'));
      wl.appendChild(mk('w-ref', data.wLeftRef || 'Ioan 1:1'));
      wr.appendChild(mk('w-quote', data.wQuote || '„Noi propovăduim pe Hristos cel răstignit."'));
      wr.appendChild(mk('w-ref', data.wRightRef || '1 Corinteni 1:23'));
      cont.appendChild(wl);
      cont.appendChild(wr);
      if (data.bgClass) setBackground(data.bgClass);
    }

    function renderText(data) {
      lastTextData = data;
      // ecranul de start in doua blocuri: stanga + dreapta
      if (data.mode === 'welcome-duo') { renderWelcome(data); return; }
      if (data.mode === 'home-duo' || data.homeLeft) { renderHomeDuo(data); return; }
      const tray0 = getDuoTray();
      if (tray0) tray0.classList.add('hidden');
      const wc0 = document.getElementById('welcomeContainer');
      if (wc0) wc0.style.display = 'none';
      mode = data.mode || 'plain';
      const area = document.getElementById('contentArea');
      const textEl = document.getElementById('slideText');
      textEl.style.display = 'block';
      const footerEl = document.getElementById('footerMessage');
      // cand se proiecteaza continut (cantare/biblie/anunt) -> tot ecranul cu voal intunecat;
      // la bun-venit poza ramane clara
      const veil = document.getElementById('veil');
      if (veil) veil.classList.toggle('on', mode === 'plain' || mode === 'notice');

      area.className = 'content-area' + (mode === 'welcome' ? ' welcome-left' : '');
      const refEl = document.getElementById('slideRef');
      const hasTitle = data.title && String(data.title).trim() !== '';
      if (hasTitle) {
        refEl.style.display = 'block';
        refEl.style.fontSize = Math.max(20, Math.round(baseFontSize(mode) * fontScale * 0.28)) + 'px';
        refEl.innerText = data.title;
      } else {
        refEl.style.display = 'none';
        refEl.innerText = '';
      }
      textEl.style.color = data.textColor || '#ffffff';
      textEl.style.textAlign = (data.align === 'left' ? 'left' : data.align === 'right' ? 'right' : 'center');
      buildRichText(textEl, data.text || '');

      // referinta / nota in partea de jos (fara titlu "Strofa X" pe ecran)
      if (data.footer || data.footerRef) {
        footerEl.innerHTML = '';
        if (data.footer) { const ft = document.createElement('span'); ft.innerText = data.footer; footerEl.appendChild(ft); }
        if (data.footerRef) {
          const r = document.createElement('span'); r.className = 'verse-ref'; r.innerText = data.footerRef;
          footerEl.appendChild(r);
        }
      } else { footerEl.innerHTML = ''; }

      fitText();
      if (data.bgClass) setBackground(data.bgClass);
    }

    ipcRenderer.on('render-slide', (event, data) => {
      if (!data) return;
      const root = document.getElementById('displayRoot');
      const media = document.getElementById('mediaPlayer');

      if (data.kind === 'black' || data.blackout) { root.classList.add('blackout'); return; }
      root.classList.remove('blackout');

      if (data.kind === 'bg') {
        if (data.image) setBackgroundImage(data.image); else setBackground(data.bgClass);
        return;
      }
      if (data.kind === 'font') {
        fontScale = Math.max(0.5, Math.min(3, fontScale + (data.delta || 0)));
        if (lastTextData) { renderText(lastTextData); } else { fitText(); }
        return;
      }
      if (data.kind === 'ytcmd') { ytCommand(data.cmd); return; }
      if (data.kind === 'yt' && data.videoId) { playYoutube(data.videoId); return; }
      if (data.kind === 'local' && data.src) { playLocal(data.src); return; }
      if (data.kind === 'ytstream' && data.src) { playLocal(data.src); return; }
      if (data.kind === 'image' && data.image) {
        stopAny();
        media.innerHTML = '<img src="' + data.image + '" alt="">';
        media.classList.add('visible'); return;
      }
      if (data.kind === 'clear' || data.mediaType === 'none') { hideMedia(); return; }

      // La text (biblie/cantare/anunt) orice media vizibila se opreste, altfel nu s-ar vedea schimbarea
      hideMediaIfNeeded();
      renderText(data);
    });
  </script>
</body>
</html>
